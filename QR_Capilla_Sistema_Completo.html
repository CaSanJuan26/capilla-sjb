<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario — Capilla San Juan Bautista</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f5f0e8; min-height: 100vh; }

.header { background: #6B1A1A; color: white; padding: 18px 16px; text-align: center; }
.header .cruz { font-size: 24px; display: block; margin-bottom: 4px; }
.header h1 { font-size: 16px; font-weight: 700; }
.header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }

.card { background: white; margin: 14px; border-radius: 12px; box-shadow: 0 3px 15px rgba(107,26,26,0.15); overflow: hidden; }
.cod-banda { background: #6B1A1A; color: white; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
.cod-banda .lbl { font-size: 10px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }
.cod-banda .cod { font-size: 19px; font-weight: 700; font-family: monospace; }
.badge { background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35); border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 600; }

.foto-box { background: #faf6f0; border-bottom: 1px solid #e8ddd0; min-height: 160px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.foto-box img { width: 100%; max-height: 240px; object-fit: cover; }
.foto-ph { text-align: center; padding: 30px; color: #b0956e; }
.foto-ph span { font-size: 44px; display: block; margin-bottom: 6px; }
.foto-ph p { font-size: 12px; }

.desc-box { padding: 14px; border-bottom: 1px solid #f0e8dc; }
.desc-box h2 { font-size: 17px; font-weight: 700; color: #3d0f0f; line-height: 1.3; }
.cat-tag { display: inline-block; margin-top: 5px; background: #fdf0dc; color: #8B4500; border: 1px solid #e8c88a; border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 600; }

.datos { padding: 10px 14px; }
.fila { display: flex; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #f5ede2; gap: 10px; }
.fila:last-child { border-bottom: none; }
.ico { font-size: 17px; width: 26px; flex-shrink: 0; text-align: center; }
.info .lbl2 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.7px; color: #9b7a5a; font-weight: 600; margin-bottom: 1px; }
.info .val { font-size: 14px; color: #2c1810; font-weight: 500; }

.est-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.Excelente { background: #d4edda; color: #155724; }
.Bueno { background: #d1ecf1; color: #0c5460; }
.Regular { background: #fff3cd; color: #856404; }
.Deteriorado { background: #f8d7da; color: #721c24; }
.otro-est { background: #e2e3e5; color: #383d41; }

.obs-box { margin: 0 14px 14px; background: #fdf8f0; border-left: 4px solid #8B6914; border-radius: 0 8px 8px 0; padding: 9px 12px; font-size: 12px; color: #5a3e20; font-style: italic; }

.not-found { margin: 20px 14px; background: #fff3cd; border: 1px solid #ffc107; border-radius: 10px; padding: 20px; text-align: center; color: #856404; }
.not-found .big { font-size: 36px; display: block; margin-bottom: 8px; }

.footer { padding: 12px; text-align: center; font-size: 10px; color: #9b7a5a; border-top: 1px solid #e0d4c4; margin-top: 6px; }
.footer strong { color: #6B1A1A; }
</style>
</head>
<body>

<div class="header">
  <span class="cruz">✝</span>
  <h1>CAPILLA SAN JUAN BAUTISTA</h1>
  <p>San Lorenzo, Paraguay &nbsp;|&nbsp; Inventario de Bienes</p>
</div>

<div id="app"></div>

<div class="footer">
  <strong>Coordinación de Pastoral — Capilla San Juan Bautista</strong><br>
  San Lorenzo, Paraguay
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  BASE DE DATOS DE BIENES
//  Para agregar un bien nuevo: copiar un bloque { } y completar
//  Para actualizar: editar directamente los valores
// ═══════════════════════════════════════════════════════════════
const BIENES = {
  "CSJ-MOB-001": {
    descripcion: "Banco de madera largo (10 personas)",
    categoria: "Mobiliario",
    ubicacion: "Nave principal",
    estado: "Bueno",
    fecha: "2018",
    responsable: "Donación comunidad",
    valor: "",
    obs: "",
    foto: ""
  },
  "CSJ-MOB-002": {
    descripcion: "Silla plástica blanca",
    categoria: "Mobiliario",
    ubicacion: "Salón parroquial",
    estado: "Regular",
    fecha: "2020",
    responsable: "Coordinación pastoral",
    valor: "",
    obs: "",
    foto: ""
  },
  "CSJ-SND-001": {
    descripcion: "Micrófono inalámbrico UHF",
    categoria: "Equipos de sonido",
    ubicacion: "Presbiterio",
    estado: "Bueno",
    fecha: "2022",
    responsable: "Donación anónima",
    valor: "850.000",
    obs: "",
    foto: ""
  },
  "CSJ-SND-002": {
    descripcion: "Parlante amplificador 200W",
    categoria: "Equipos de sonido",
    ubicacion: "Nave lateral izquierda",
    estado: "Bueno",
    fecha: "2022",
    responsable: "Donación anónima",
    valor: "1.200.000",
    obs: "",
    foto: ""
  },
  "CSJ-LIT-001": {
    descripcion: "Cáliz dorado grande",
    categoria: "Objetos litúrgicos",
    ubicacion: "Sacristía",
    estado: "Excelente",
    fecha: "2010",
    responsable: "Donación padrino",
    valor: "",
    obs: "Bien de valor patrimonial. Requiere cuidado especial.",
    foto: ""
  },
  "CSJ-LIT-002": {
    descripcion: "Custodia para exposición",
    categoria: "Objetos litúrgicos",
    ubicacion: "Sacristía",
    estado: "Bueno",
    fecha: "2015",
    responsable: "Donación feligrés",
    valor: "",
    obs: "",
    foto: ""
  },
  "CSJ-ELE-001": {
    descripcion: "Proyector multimedia",
    categoria: "Equipos electrónicos",
    ubicacion: "Nave principal",
    estado: "Bueno",
    fecha: "2021",
    responsable: "Recaudación capilla",
    valor: "1.500.000",
    obs: "",
    foto: ""
  },
  "CSJ-ELE-002": {
    descripcion: "Televisor LED 55 pulgadas",
    categoria: "Equipos electrónicos",
    ubicacion: "Salón parroquial",
    estado: "Bueno",
    fecha: "2023",
    responsable: "Recaudación capilla",
    valor: "2.200.000",
    obs: "",
    foto: ""
  }
};

// ═══════════════════════════════════════════════════════════════
//  MOTOR — no tocar
// ═══════════════════════════════════════════════════════════════
function estClase(e) {
  return ["Excelente","Bueno","Regular","Deteriorado"].includes(e) ? e : "otro-est";
}

function render() {
  const codigo = decodeURIComponent(location.hash.replace("#","")).trim().toUpperCase();
  const app = document.getElementById("app");
  const b = BIENES[codigo];

  if (!codigo || !b) {
    app.innerHTML = `<div class="not-found">
      <span class="big">🔍</span>
      <strong>Bien no encontrado</strong><br><br>
      ${codigo ? "Código: <b>" + codigo + "</b><br><br>" : ""}
      <small>Verificá que el código exista en el inventario.</small>
    </div>`;
    return;
  }

  const fotoHTML = b.foto
    ? `<img src="${b.foto}" alt="Foto" onerror="this.parentElement.innerHTML='<div class=foto-ph><span>📷</span><p>Foto no disponible</p></div>'">`
    : `<div class="foto-ph"><span>📷</span><p>Foto del bien</p></div>`;

  const obsHTML = b.obs
    ? `<div class="obs-box">💬 ${b.obs}</div>` : "";

  const valorHTML = b.valor ? `Gs. ${b.valor}` : "—";

  app.innerHTML = `
  <div class="card">
    <div class="cod-banda">
      <div><div class="lbl">Código del bien</div><div class="cod">${codigo}</div></div>
      <div class="badge">${b.categoria}</div>
    </div>
    <div class="foto-box">${fotoHTML}</div>
    <div class="desc-box">
      <h2>${b.descripcion}</h2>
      <span class="cat-tag">${b.categoria}</span>
    </div>
    <div class="datos">
      <div class="fila"><div class="ico">📍</div><div class="info"><div class="lbl2">Ubicación</div><div class="val">${b.ubicacion}</div></div></div>
      <div class="fila"><div class="ico">✅</div><div class="info"><div class="lbl2">Estado</div><div class="val"><span class="est-badge ${estClase(b.estado)}">${b.estado}</span></div></div></div>
      <div class="fila"><div class="ico">📅</div><div class="info"><div class="lbl2">Fecha de adquisición</div><div class="val">${b.fecha}</div></div></div>
      <div class="fila"><div class="ico">🙏</div><div class="info"><div class="lbl2">Responsable / Donante</div><div class="val">${b.responsable}</div></div></div>
      <div class="fila"><div class="ico">💰</div><div class="info"><div class="lbl2">Valor estimado</div><div class="val">${valorHTML}</div></div></div>
    </div>
    ${obsHTML}
  </div>`;
}

render();
window.addEventListener("hashchange", render);
</script>
</body>
</html>
